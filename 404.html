<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Page Not Found — Mathura P.G. College</title>
  <link rel="icon" type="image/png" href="assets/logo.png">
  <link rel="stylesheet" href="assets/css/styles.css">
  <style>
    .not-found-container {
      min-height: 80vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      text-align: center;
      padding: 40px 20px;
    }
    .not-found-code {
      font-size: 72px;
      font-weight: 800;
      color: #0d2847;
      margin: 0;
      line-height: 1;
    }
    .not-found-title {
      font-size: 24px;
      font-weight: 600;
      color: #334155;
      margin: 16px 0 8px;
    }
    .not-found-desc {
      font-size: 16px;
      color: #64748b;
      max-width: 460px;
      margin: 0 0 24px;
    }
    .btn-home {
      display: inline-block;
      padding: 12px 28px;
      background: #0d2847;
      color: #ffffff;
      text-decoration: none;
      border-radius: 8px;
      font-weight: 600;
      transition: background 0.2s ease;
    }
    .btn-home:hover {
      background: #1e3a5f;
    }
  </style>
</head>
<body>
  <div class="not-found-container">
    <img src="assets/logo.png" alt="Mathura P.G. College Logo" style="width: 80px; height: 80px; margin-bottom: 20px;">
    <h1 class="not-found-code">404</h1>
    <h2 class="not-found-title">Page Not Found</h2>
    <p class="not-found-desc">The page you are looking for doesn't exist or has been moved.</p>
    <a href="index.html" class="btn-home">Return to Home</a>
  </div>
</body>
</html>
